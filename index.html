<!DOCTYPE html>
<html>
<head>
  <title>Citadel Prime</title>
  <link rel="icon" type="image/png" href="/citadel-favicon.png">
</head>
<body>
  <iframe 
    src="https://script.google.com/a/*/macros/s/AKfycby9ICb_k5aKwmjTlObxzLz5j4o6vVrevbefbjvg8r9_yT87615g9uzs8_UPVhNp5PklWA/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
